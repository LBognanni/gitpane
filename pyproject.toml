[project]
name = "gitpane"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "unidiff>=1.0.0",
]

[project.scripts]
gitpane = "gitpane.app:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
